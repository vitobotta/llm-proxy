<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="LLM Proxy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <ellipse cx="920" cy="120" rx="380" ry="260" fill="url(#glow)"/>

  <!-- decorative routing motif -->
  <g stroke="#334155" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M760 160 C 830 160, 850 90, 920 90"/>
    <path d="M760 160 C 830 160, 850 160, 920 160"/>
    <path d="M760 160 C 830 160, 850 230, 920 230"/>
  </g>
  <g stroke="url(#accent)" stroke-width="2.5" fill="none">
    <path d="M760 160 C 830 160, 850 90, 920 90"/>
  </g>

  <!-- hub -->
  <rect x="700" y="132" width="56" height="56" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2.5"/>
  <circle cx="728" cy="160" r="10" fill="#818cf8"/>

  <!-- provider nodes -->
  <g>
    <circle cx="936" cy="90" r="17" fill="#0f2f2a" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="936" cy="90" r="6" fill="#34d399"/>
    <circle cx="936" cy="160" r="17" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <circle cx="936" cy="160" r="6" fill="#64748b"/>
    <circle cx="936" cy="230" r="17" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <circle cx="936" cy="230" r="6" fill="#64748b"/>
  </g>
  <g font-family="Inter, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="17" fill="#94a3b8">
    <text x="968" y="96" fill="#34d399">fastest right now</text>
    <text x="968" y="166">standby</text>
    <text x="968" y="236">quota-paused</text>
  </g>

  <!-- title -->
  <text x="64" y="146" font-family="Inter, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="72" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">LLM Proxy</text>
  <rect x="66" y="170" width="180" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="64" y="216" font-family="Inter, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="25" fill="#94a3b8">Route every request to the fastest provider.</text>
  <text x="64" y="252" font-family="Inter, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="25" fill="#94a3b8">Fall back automatically when one breaks.</text>
</svg>
